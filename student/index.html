<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Art School - Welcome</title>
    <link rel="stylesheet" href="assets/css/splash.css">
</head>
<body>
    <div class="splash-container">
        <div class="logo-container">
            <!-- Logo SVG - Digital University Kerala inspired -->
            <svg class="logo" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
                <!-- Circle part of logo -->
                <circle cx="40" cy="60" r="35" fill="none" stroke="#0366B0" stroke-width="6" class="circle-part"/>
                
                <!-- K shape in logo -->
                <path d="M 40 30 L 40 90" stroke="#0366B0" stroke-width="6" stroke-linecap="round" class="k-vertical"/>
                <path d="M 40 60 L 70 35" stroke="#02B393" stroke-width="6" stroke-linecap="round" class="k-top"/>
                <path d="M 40 60 L 70 85" stroke="#02B393" stroke-width="6" stroke-linecap="round" class="k-bottom"/>
                
                <!-- Circuit pattern -->
                <circle cx="75" cy="40" r="3" fill="#A3CE47" class="circuit-node"/>
                <circle cx="75" cy="80" r="3" fill="#A3CE47" class="circuit-node"/>
                <line x1="70" y1="35" x2="75" y2="40" stroke="#A3CE47" stroke-width="2" class="circuit-line"/>
                <line x1="70" y1="85" x2="75" y2="80" stroke="#A3CE47" stroke-width="2" class="circuit-line"/>
                
                <!-- Text -->
                <text x="95" y="50" font-family="'Brandon Grotesque', 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#606060" class="logo-text">
                    DIGITAL
                </text>
                <text x="95" y="75" font-family="'Brandon Grotesque', 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#606060" class="logo-text">
                    ART SCHOOL
                </text>
                <text x="95" y="95" font-family="'Campton', 'Arial', sans-serif" font-size="11" fill="#606060" class="tagline">
                    Curating excellence in traditional arts
                </text>
            </svg>
        </div>
    </div>

    <script src="assets/js/splash.js"></script>
</body>
</html>
